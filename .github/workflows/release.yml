name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version tag (e.g. v1.0.0). Leave blank to auto-bump patch."
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.version }}"
          if [ -n "$requested" ]; then
            tag="$requested"
          else
            latest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)"
            if [ -z "$latest" ]; then
              tag="v0.1.0"
            else
              ver="${latest#v}"
              IFS='.' read -r major minor patch <<< "$ver"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing: $tag"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"
