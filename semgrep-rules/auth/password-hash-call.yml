rules:
  - id: bcrypt-hash-call
    message: bcrypt, argon2, or scrypt hash call — review for missing policy enforcement.
    languages: [typescript, javascript]
    severity: INFO
    pattern-either:
      - pattern: bcrypt.hash($PWD, $ROUNDS)
      - pattern: bcrypt.hashSync($PWD, $ROUNDS)
      - pattern: argon2.hash($PWD)
      - pattern: argon2.hash($PWD, ...)
      - pattern: scrypt($PWD, $SALT, $LEN, ...)
      - pattern: crypto.scrypt($PWD, $SALT, $LEN, ...)

  - id: password-reset-token-gen
    message: Password reset flow — review for weak token generation or missing expiry.
    languages: [typescript, javascript]
    severity: INFO
    pattern-either:
      - pattern: crypto.randomBytes($N)
      - pattern: crypto.randomUUID()
      - patterns:
          - pattern: '$DB.$MODEL.update({..., resetToken: $TOK, ...})'
          - metavariable-regex:
              metavariable: $MODEL
              regex: (user|User|account|Account|member|Member)
      - patterns:
          - pattern: '$DB.$MODEL.create({..., resetToken: $TOK, ...})'
          - metavariable-regex:
              metavariable: $MODEL
              regex: (user|User|account|Account|member|Member)
