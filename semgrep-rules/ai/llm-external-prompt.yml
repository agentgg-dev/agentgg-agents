rules:
  - id: llm-prompt-template-literal
    message: LLM call with a template-literal prompt that may interpolate untrusted input.
    languages: [typescript, javascript]
    severity: WARNING
    pattern-either:
      - pattern: streamText({..., prompt: `...`, ...})
      - pattern: generateText({..., prompt: `...`, ...})
      - pattern: generateObject({..., prompt: `...`, ...})
      - pattern: streamObject({..., prompt: `...`, ...})
      - pattern: streamText({..., system: `...`, ...})
      - pattern: generateText({..., system: `...`, ...})
      - pattern: $CLIENT.chat.completions.create({..., messages: [...], ...})
      - pattern: $ANTHROPIC.messages.create({..., messages: [...], ...})

  - id: llm-system-prompt-env-interpolation
    message: LLM system prompt interpolates a process.env secret — the value is sent to the model provider.
    languages: [typescript, javascript]
    severity: WARNING
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: process.env.$VAR
          - metavariable-regex:
              metavariable: $VAR
              regex: (SECRET|KEY|TOKEN|PASSWORD|PRIVATE|CREDENTIAL|API_KEY)
    pattern-sinks:
      - pattern: streamText({..., system: ..., ...})
      - pattern: generateText({..., system: ..., ...})
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern: $ANTHROPIC.messages.create(...)
