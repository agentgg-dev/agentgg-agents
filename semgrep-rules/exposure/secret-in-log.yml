rules:
  - id: secret-named-var-in-log
    message: Secret-named variable passed to a logging sink.
    languages: [typescript, javascript]
    severity: WARNING
    pattern-either:
      - patterns:
          - pattern: console.$LEVEL($SECRET)
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(log|warn|error|info|debug)$
          - metavariable-regex:
              metavariable: $SECRET
              regex: (token|Token|secret|Secret|password|Password|apiKey|api_key|credential|Credential|accessToken|refreshToken|privateKey|bearerToken|decryptedValue|plaintext|cleartext)
      - patterns:
          - pattern: $LOGGER.$LEVEL($SECRET)
          - metavariable-regex:
              metavariable: $LOGGER
              regex: ^(logger|log|winston|bunyan|pino|morgan)$
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(log|warn|error|info|debug|fatal)$
          - metavariable-regex:
              metavariable: $SECRET
              regex: (token|Token|secret|Secret|password|Password|apiKey|api_key|credential|Credential|accessToken|refreshToken|privateKey|bearerToken|decryptedValue|plaintext|cleartext)

  - id: decrypted-value-to-log-sink
    message: Decrypted or plaintext value flows to a logging or HTTP response sink.
    languages: [typescript, javascript]
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: $X.decrypt(...)
      - pattern: decrypt(...)
      - pattern: decryptAes(...)
      - pattern: crypto.createDecipheriv(...)
      - patterns:
          - pattern: $PLAINTEXT = ...
          - metavariable-regex:
              metavariable: $PLAINTEXT
              regex: (decrypted|plaintext|cleartext|decryptedValue|rawSecret)
    pattern-sinks:
      - pattern: console.log(...)
      - pattern: console.error(...)
      - pattern: console.warn(...)
      - pattern: logger.info(...)
      - pattern: logger.error(...)
      - pattern: logger.warn(...)
      - pattern: $RES.json(...)
      - pattern: $RES.send(...)
      - pattern: $SPAN.setAttribute(...)
      - pattern: Sentry.captureException(...)
      - pattern: Sentry.setExtra(...)
