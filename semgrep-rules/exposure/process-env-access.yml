rules:
  - id: process-env-secret-access
    message: process.env access for a secret-named variable.
    languages: [typescript, javascript]
    severity: INFO
    pattern-either:
      - patterns:
          - pattern: process.env.$VAR
          - metavariable-regex:
              metavariable: $VAR
              regex: (SECRET|TOKEN|KEY|PASSWORD|PRIVATE|CREDENTIAL|API_KEY|JWT|AUTH|ACCESS_KEY|AWS_SECRET)
      - patterns:
          - pattern: process.env["$VAR"]
          - metavariable-regex:
              metavariable: $VAR
              regex: (SECRET|TOKEN|KEY|PASSWORD|PRIVATE|CREDENTIAL|API_KEY|JWT|AUTH|ACCESS_KEY|AWS_SECRET)

  - id: process-env-fallback-literal
    message: process.env access with a hardcoded string fallback — the fallback may become the real secret in dev environments.
    languages: [typescript, javascript]
    severity: WARNING
    pattern-either:
      - pattern: process.env.$X ?? "..."
      - pattern: process.env.$X || "..."
      - pattern: process.env.$X !== undefined ? process.env.$X : "..."

  - id: next-public-secret-env
    message: NEXT_PUBLIC_ environment variable with a secret-shaped name is exposed to the browser bundle.
    languages: [typescript, javascript]
    severity: WARNING
    patterns:
      - pattern: process.env.$VAR
      - metavariable-regex:
          metavariable: $VAR
          regex: ^NEXT_PUBLIC_.*(SECRET|TOKEN|KEY|PASSWORD|PRIVATE|CREDENTIAL)
