rules:
  - id: hardcoded-secret-assignment
    message: String literal assigned to a secret-named variable.
    languages: [typescript, javascript]
    severity: WARNING
    pattern-either:
      - patterns:
          - pattern: const $KEY = "..."
          - metavariable-regex:
              metavariable: $KEY
              regex: (apiKey|api_key|secretKey|secret_key|password|Password|token|Token|credential|privateKey|bearerToken|accessToken|clientSecret|jwtSecret)
      - patterns:
          - pattern: let $KEY = "..."
          - metavariable-regex:
              metavariable: $KEY
              regex: (apiKey|api_key|secretKey|secret_key|password|Password|token|Token|credential|privateKey|bearerToken|accessToken|clientSecret|jwtSecret)
      - patterns:
          - pattern: $KEY = "..."
          - metavariable-regex:
              metavariable: $KEY
              regex: (apiKey|api_key|secretKey|secret_key|password|Password|token|Token|credential|privateKey|bearerToken|accessToken|clientSecret|jwtSecret)

  - id: hardcoded-secret-object-field
    message: Object literal field with a secret-shaped name assigned a string value.
    languages: [typescript, javascript]
    severity: WARNING
    patterns:
      - pattern: |
          {$KEY: "..."}
      - metavariable-regex:
          metavariable: $KEY
          regex: (apiKey|api_key|secretKey|secret_key|password|token|credential|privateKey|accessToken|clientSecret|jwtSecret)
