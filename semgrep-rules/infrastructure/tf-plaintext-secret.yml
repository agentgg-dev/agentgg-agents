rules:
  - id: tf-variable-secret-default
    message: Terraform variable or local with a secret-shaped name has a non-empty default value.
    languages: [hcl]
    severity: WARNING
    pattern-either:
      - pattern: |
          variable $NAME {
            default = "..."
            ...
          }
      - pattern: |
          locals {
            $KEY = "..."
            ...
          }

  - id: tf-resource-plaintext-password
    message: Terraform resource argument with a password or secret name set to a string literal.
    languages: [hcl]
    severity: WARNING
    pattern-either:
      - pattern: |
          password = "..."
      - pattern: |
          secret = "..."
      - pattern: |
          master_password = "..."
      - pattern: |
          db_password = "..."
      - pattern: |
          token = "..."
