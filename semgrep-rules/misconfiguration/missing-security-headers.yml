rules:
  - id: helmet-disabled-csp
    message: Helmet middleware with Content-Security-Policy disabled — review all security header settings.
    languages: [typescript, javascript]
    severity: WARNING
    pattern-either:
      - pattern: 'helmet({contentSecurityPolicy: false})'
      - pattern: 'helmet({contentSecurityPolicy: false, ...})'
      - pattern: 'helmet({frameguard: false, ...})'
      - pattern: 'helmet({noSniff: false, ...})'
      - pattern: 'helmet({hsts: false, ...})'
      - pattern: '$APP.use(helmet({contentSecurityPolicy: false}))'
      - pattern: '$APP.use(helmet({contentSecurityPolicy: false, ...}))'

  - id: middleware-setup-call
    message: Security middleware setup — review for missing CSP, HSTS, X-Frame-Options, and other headers.
    languages: [typescript, javascript]
    severity: INFO
    pattern-either:
      - pattern: $APP.use(helmet())
      - pattern: $APP.use(helmet(...))
      - pattern: app.use(cors(...))
      - pattern: $APP.use(cors(...))
      - pattern: NextResponse.next()
      - pattern: $RES.setHeader("Content-Security-Policy", ...)
      - pattern: $RES.setHeader("Strict-Transport-Security", ...)
